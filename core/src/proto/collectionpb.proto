syntax = "proto3";

// 藏品宝典（蓝晶藏品）
// GetCollections 与官方 2026-11-01 客户端编码器及 GetCollections 抓包核对。
// UpgradeCollection / SwitchSceneDisplay / ClaimCollectionReward 请求与回复字段号来自
// 2026-11-09 网关抓包（HAR，请求体经本地 TSDK 运行时解密），证据级别 historical-plaintext-capture；
// 尚未与官方生成代码逐字段核对，字段名按回复语义命名。
package gamepb.collectionpb;

service CollectionService {
  rpc GetCollections(GetCollectionsRequest) returns (GetCollectionsReply);
  rpc UpgradeCollection(UpgradeCollectionRequest) returns (UpgradeCollectionReply);
  rpc SwitchSceneDisplay(SwitchSceneDisplayRequest) returns (SwitchSceneDisplayReply);
  rpc ClaimCollectionReward(ClaimCollectionRewardRequest) returns (ClaimCollectionRewardReply);
}

message GetCollectionsRequest {
    repeated int32 categories = 1; // 1 = 蓝晶藏品
}

message CollectionInfo {
    int64 collection_id = 1;
    int32 star_level = 2;
    bool is_new = 3;
    int64 first_obtained_time = 4;
    int64 own_count = 5;
}

message PedestalInfo {
    int64 pedestal_id = 1;
    bool is_new = 2;
}

message WishInfo {
    int32 series_id = 1;
    int64 collection_id = 2;
    int64 cooldown_until = 3;
}

message CategoryDetail {
    int32 category = 1;
    repeated CollectionInfo collections = 2;
    repeated PedestalInfo pedestals = 3;
    repeated WishInfo wished = 4;
    int32 claimed_reward_score = 5;
    int32 current_score = 6;
    int64 collection_like_count = 7;
    int64 pedestal_like_count = 8;
}

message DisplayInfo {
    int32 category = 1;
    int64 item_id = 2;
    // 官方客户端在 SwitchSceneDisplay 请求中会显式编码 0（proto3 optional 显式存在性）。
    optional int64 pedestal_id = 3;
}

message DisplaySlot {
    int32 slot_type = 1;
    DisplayInfo display = 2;
}

message GetCollectionsReply {
    repeated CategoryDetail details = 1;
    repeated DisplaySlot display_slots = 2;
}

// 激活/升星藏品：请求 {1: category, 2: collection_id}，消耗对应藏品（服务端校验库存）。
message UpgradeCollectionRequest {
    int64 category = 1;
    int64 collection_id = 2;
}

// 回复 {1: category, 2: collection_id, 3: 升星后星级, 4: 升星后当前评分}。
message UpgradeCollectionReply {
    int64 category = 1;
    int64 collection_id = 2;
    int64 star_level = 3;
    int64 current_score = 4;
}

// 切换场景展示：请求 {1: DisplaySlot{1: slot_type, 2: DisplayInfo{1: category, 2: item_id, 3: pedestal_id}}}。
// 抓包中 slot_type=1，pedestal_id 显式编码 0（proto3 optional 显式存在性）。
message SwitchSceneDisplayRequest {
    DisplaySlot display_slot = 1;
}

// 回复 {1: DisplaySlot{1: slot_type, 2: DisplayInfo}}。
message SwitchSceneDisplayReply {
    DisplaySlot display_slot = 1;
}

// 领取评分奖励：请求 {1: category}，服务端一次性领取所有已达成未领取档位。
message ClaimCollectionRewardRequest {
    int64 category = 1;
}

// 回复 {2: 领取后当前评分, 3: 领取后 claimed_reward_score, 4: 本次领取的里程碑分数列表}。
// field 1 在抓包中恒为 0（未编码），推断为结果码，暂不定义。
message ClaimCollectionRewardReply {
    int64 current_score = 2;
    int64 claimed_reward_score = 3;
    repeated int32 claimed_scores = 4 [packed = true];
}
